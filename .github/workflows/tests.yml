name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install coverage tool
        run: dotnet tool install --tool-path .tools coverlet.console --version 10.0.1
      - name: Build tests
        run: dotnet build tests/ControllerInput.Tests.csproj --configuration Release
      - name: Run tests with coverage
        run: >-
          .tools/coverlet tests/bin/Release/net10.0/ControllerInput.Tests.dll
          --target dotnet
          --targetargs "tests/bin/Release/net10.0/ControllerInput.Tests.dll"
          --include "[ControllerInput.Tests]ControllerInput"
          --include "[ControllerInput.Tests]TrainerBindings"
          --include "[ControllerInput.Tests]GameInputBlocker"
          --include "[ControllerInput.Tests]InputConsumption"
          --include "[ControllerInput.Tests]FlightHeading"
          --include "[ControllerInput.Tests]TrainerLifetime"
          --include "[ControllerInput.Tests]BindingStore"
          --include "[ControllerInput.Tests]VehicleModifierValue"
          --include "[ControllerInput.Tests]VehiclePreferences"
          --include "[ControllerInput.Tests]VehiclePresets"
          --include "[ControllerInput.Tests]VehicleAssists"
          --include "[ControllerInput.Tests]SurfaceDrive"
          --include "[ControllerInput.Tests]VehicleFlip"
          --include "[ControllerInput.Tests]VehicleValueInput"
          --include "[ControllerInput.Tests]VehicleRepair"
          --include "[ControllerInput.Tests]VehicleControls"
          --include "[ControllerInput.Tests]VehicleValueGroup*"
          --include "[ControllerInput.Tests]VehicleProtection"
          --include "[ControllerInput.Tests]VehicleOverdrive"
          --include "[ControllerInput.Tests]OverdriveRatio"
          --include "[ControllerInput.Tests]VehicleTuning"
          --include "[ControllerInput.Tests]SimpleVehicleTuning"
          --include "[ControllerInput.Tests]VehicleUserPresets*"
          --include "[ControllerInput.Tests]VehicleTuneSnapshot"
          --include "[ControllerInput.Tests]VehiclePreferenceStore"
          --include-test-assembly
          --format json --output coverage.json
      - name: Report production coverage
        run: python3 tests/report_coverage.py coverage.json
