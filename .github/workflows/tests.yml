name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install coverage tool
        run: dotnet tool install --tool-path .tools coverlet.console --version 10.0.2
      - name: Build tests
        run: dotnet build tests/ControllerInput.Tests.csproj --configuration Release
      - name: Run tests with coverage
        run: >-
          .tools/coverlet tests/bin/Release/net10.0/ControllerInput.Tests.dll
          --target dotnet
          --targetargs "tests/bin/Release/net10.0/ControllerInput.Tests.dll"
          --include "[ControllerInput.Tests]ControllerInput"
          --format json --output coverage.json
      - name: Report production coverage
        run: python3 tests/report_coverage.py coverage.json
